    <rect x="56" y="150" width="180" height="34" rx="17" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="146" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#1f2328" text-anchor="middle" letter-spacing="0">Claude Code</text>
  
