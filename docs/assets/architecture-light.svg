<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">agent-code-search architecture</title>
  <desc id="desc">A coding agent calls semantic-index over MCP or the shell. Both surfaces share one engine for semantic search and call-graph tracing, which uses a local Ollama model, tree-sitter and a local index folder. Everything runs on your machine.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
    <marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8c959f"/></marker>
  </defs>

  <!-- Local-machine boundary -->
  <rect x="12" y="12" width="976" height="446" rx="22" fill="none" stroke="#1a7f37" stroke-opacity="0.7" stroke-width="1.4" stroke-dasharray="6 6"/>
  <circle cx="40" cy="42" r="4" fill="#1a7f37"/>
  <text x="52" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="start" letter-spacing="1.2">RUNS ENTIRELY ON YOUR MACHINE  ·  NO CODE LEAVES LOCALHOST</text>

